[project]
name = "wow-tools"
version = "0.1.0"
description = "collection of tools to automate WoW tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ahk[binary]>=1.8.4",
    "dotenv>=0.9.9",
    "dxcam[cv2,winrt]>=0.3.0",
    "ipykernel>=6.29.5",
    "ipython>=9.4.0",
    "matplotlib>=3.10.7",
    "networkx>=3.5",
    "ollama>=0.6.1",
    "opencv-python>=4.12.0.88",
    "overlay",
    "pillow>=11.3.0",
    "pyside6>=6.10.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.2",
    "pywin32>=311",
    "qasync>=0.28.0",
    "ruff>=0.14.3",
    "scikit-image>=0.25.2",
    "scipy>=1.16.3",
    "types-pywin32>=312.0.0.20260724",
]

[tool.uv.sources]
overlay = { path = "../overlay" }
